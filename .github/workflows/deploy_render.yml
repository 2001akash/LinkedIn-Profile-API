name: Deploy to Render (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GHCR (optional)
        run: |
          if [ -n "$GHCR_TOKEN" ]; then
            echo "Logging in to GHCR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          else
            echo "GHCR_TOKEN not set; skipping login"
          fi
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Build image (load locally)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/linkedin-profile-api:${{ github.sha }}

      - name: Push to GHCR (optional)
        run: |
          if [ -n "$GHCR_TOKEN" ]; then
            echo "Pushing image to GHCR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker push ghcr.io/${{ github.repository_owner }}/linkedin-profile-api:${{ github.sha }}
          else
            echo "GHCR_TOKEN not set; skipping push"
          fi
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Trigger Render deploy (optional)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "Triggering Render deploy via API"
            curl -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":true}' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          else
            echo "RENDER_API_KEY or RENDER_SERVICE_ID not set; skipping Render trigger"
          fi
